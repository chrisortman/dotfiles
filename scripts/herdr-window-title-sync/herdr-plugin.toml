id = "window-title-sync"
name = "Window Title Sync"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Sync the outer terminal title to the focused Herdr workspace, tab, and agent session."
platforms = ["macos", "linux"]

[[actions]]
id = "refresh"
title = "Refresh terminal title"
contexts = ["workspace", "tab", "pane"]
command = ["zig-out/bin/sync-title"]

[[events]]
on = "workspace.focused"
command = ["zig-out/bin/sync-title"]

[[events]]
on = "workspace.renamed"
command = ["zig-out/bin/sync-title"]

[[events]]
on = "workspace.updated"
command = ["zig-out/bin/sync-title"]

[[events]]
on = "tab.focused"
command = ["zig-out/bin/sync-title"]

[[events]]
on = "tab.renamed"
command = ["zig-out/bin/sync-title"]

[[events]]
on = "pane.focused"
command = ["zig-out/bin/sync-title"]

[[events]]
on = "pane.agent_detected"
command = ["zig-out/bin/sync-title"]

[[events]]
on = "pane.agent_status_changed"
command = ["zig-out/bin/sync-title"]

[[events]]
on = "pane.moved"
command = ["zig-out/bin/sync-title"]

[[events]]
on = "pane.created"
command = ["zig-out/bin/sync-title"]

[[events]]
on = "pane.closed"
command = ["zig-out/bin/sync-title"]
