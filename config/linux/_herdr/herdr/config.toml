onboarding = false
[worktrees]
directory = "~/code/worktrees"

[keys]
prefix = "ctrl+a"
split_vertical = ["prefix+v", "prefix+double_quote"]
split_horizontal = ["prefix+minus", "prefix+percent"]
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
previous_tab = "prefix+h"
next_tab = "prefix+l"
previous_workspace = ""
next_workspace = ""
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_down = "down"
navigate_pane_up = "up"
previous_agent = "prefix+k"
next_agent = "prefix+j"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-nav.focus-left"
description = "Focus left vim split or herdr pane"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-nav.focus-down"
description = "Focus down vim split or herdr pane"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-nav.focus-up"
description = "Focus up vim split or herdr pane"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-nav.focus-right"
description = "Focus right vim split or herdr pane"

